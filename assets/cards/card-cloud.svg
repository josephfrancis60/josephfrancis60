<svg width="380" height="216" viewBox="0 0 380 216" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" shape-rendering="crispEdges" role="img" aria-label="INFRASTRUCTURE">
  <title>INFRASTRUCTURE</title>
  <!-- Shadow -->
  <rect x="4" y="4" width="376" height="212" fill="#000000" opacity="0.55"/>
  <!-- Background -->
  <rect x="0" y="0" width="380" height="216" fill="#0D0221"/>
  <!-- Color tint -->
  <rect x="0" y="0" width="380" height="216" fill="#4D9FFF" opacity="0.06"/>
  <!-- Outer border -->
  <rect x="2" y="2" width="376" height="212" fill="none" stroke="#4D9FFF" stroke-width="2"/>
  <!-- Top accent strip -->
  <rect x="2" y="2" width="376" height="34" fill="#4D9FFF" opacity="0.12"/>
  <!-- Corner TL -->
  <rect x="0"  y="0"  width="10" height="2"  fill="#4D9FFF"/>
  <rect x="0"  y="0"  width="2"  height="10" fill="#4D9FFF"/>
  <!-- Corner TR -->
  <rect x="370" y="0"            width="10" height="2"  fill="#4D9FFF"/>
  <rect x="378"  y="0"            width="2"  height="10" fill="#4D9FFF"/>
  <!-- Corner BL -->
  <rect x="0"                  y="214"  width="10" height="2"  fill="#4D9FFF"/>
  <rect x="0"                  y="206" width="2"  height="10" fill="#4D9FFF"/>
  <!-- Corner BR -->
  <rect x="370"  y="214"  width="10" height="2"  fill="#4D9FFF"/>
  <rect x="378"   y="206" width="2"  height="10" fill="#4D9FFF"/>
  <!-- Status dot -->
  <rect x="14" y="13" width="6" height="6" fill="#4D9FFF">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- Title -->
  <text x="28" y="20" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#4D9FFF" dominant-baseline="central">// INFRASTRUCTURE</text>
  <!-- Separator line -->
  <rect x="2" y="36" width="376" height="1" fill="#4D9FFF" opacity="0.4"/>
  <!-- Badges -->
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/docker.svg" x="62" y="52" width="110" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/kubernetes.svg" x="178" y="52" width="140" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/azure.svg" x="58" y="91" width="103" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/googlecloud.svg" x="167" y="91" width="155" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/github.svg" x="30" y="130" width="110" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/git.svg" x="146" y="130" width="88" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/vercel.svg" x="240" y="130" width="110" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/render.svg" x="73" y="169" width="110" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/netlify.svg" x="189" y="169" width="118" height="33"/>
</svg>