<svg width="380" height="216" viewBox="0 0 380 216" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" shape-rendering="crispEdges" role="img" aria-label="CREATOR TOOLKIT">
  <title>CREATOR TOOLKIT</title>
  <!-- Shadow -->
  <rect x="4" y="4" width="376" height="212" fill="#000000" opacity="0.55"/>
  <!-- Background -->
  <rect x="0" y="0" width="380" height="216" fill="#0D0221"/>
  <!-- Color tint -->
  <rect x="0" y="0" width="380" height="216" fill="#FFD700" opacity="0.06"/>
  <!-- Outer border -->
  <rect x="2" y="2" width="376" height="212" fill="none" stroke="#FFD700" stroke-width="2"/>
  <!-- Top accent strip -->
  <rect x="2" y="2" width="376" height="34" fill="#FFD700" opacity="0.12"/>
  <!-- Corner TL -->
  <rect x="0"  y="0"  width="10" height="2"  fill="#FFD700"/>
  <rect x="0"  y="0"  width="2"  height="10" fill="#FFD700"/>
  <!-- Corner TR -->
  <rect x="370" y="0"            width="10" height="2"  fill="#FFD700"/>
  <rect x="378"  y="0"            width="2"  height="10" fill="#FFD700"/>
  <!-- Corner BL -->
  <rect x="0"                  y="214"  width="10" height="2"  fill="#FFD700"/>
  <rect x="0"                  y="206" width="2"  height="10" fill="#FFD700"/>
  <!-- Corner BR -->
  <rect x="370"  y="214"  width="10" height="2"  fill="#FFD700"/>
  <rect x="378"   y="206" width="2"  height="10" fill="#FFD700"/>
  <!-- Status dot -->
  <rect x="14" y="13" width="6" height="6" fill="#FFD700">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- Title -->
  <text x="28" y="20" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#FFD700" dominant-baseline="central">// CREATOR TOOLKIT</text>
  <!-- Separator line -->
  <rect x="2" y="36" width="376" height="1" fill="#FFD700" opacity="0.4"/>
  <!-- Badges -->
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/postman.svg" x="69" y="52" width="118" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/swagger.svg" x="193" y="52" width="118" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/openapiinitiative.svg" x="22" y="91" width="118" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/figma.svg" x="146" y="91" width="103" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/canva.svg" x="255" y="91" width="103" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/powerbi.svg" x="69" y="130" width="125" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/twilio.svg" x="200" y="130" width="110" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/arduino.svg" x="50" y="169" width="118" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/raspberrypi.svg" x="174" y="169" width="155" height="33"/>
</svg>