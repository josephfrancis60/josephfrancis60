  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/javascript.svg" x="193" y="91" width="140" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/html5.svg" x="22" y="130" width="103" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/css.svg" x="131" y="130" width="95" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/markdown.svg" x="232" y="130" width="125" height="33"/>
