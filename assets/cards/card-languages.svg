<svg width="380" height="216" viewBox="0 0 380 216" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" shape-rendering="crispEdges" role="img" aria-label="LANGUAGES">
  <title>LANGUAGES</title>
  <!-- Shadow -->
  <rect x="4" y="4" width="376" height="212" fill="#000000" opacity="0.55"/>
  <!-- Background -->
  <rect x="0" y="0" width="380" height="216" fill="#0D0221"/>
  <!-- Color tint -->
  <rect x="0" y="0" width="380" height="216" fill="#39FF14" opacity="0.06"/>
  <!-- Outer border -->
  <rect x="2" y="2" width="376" height="212" fill="none" stroke="#39FF14" stroke-width="2"/>
  <!-- Top accent strip -->
  <rect x="2" y="2" width="376" height="34" fill="#39FF14" opacity="0.12"/>
  <!-- Corner TL -->
  <rect x="0"  y="0"  width="10" height="2"  fill="#39FF14"/>
  <rect x="0"  y="0"  width="2"  height="10" fill="#39FF14"/>
  <!-- Corner TR -->
  <rect x="370" y="0"            width="10" height="2"  fill="#39FF14"/>
  <rect x="378"  y="0"            width="2"  height="10" fill="#39FF14"/>
  <!-- Corner BL -->
  <rect x="0"                  y="214"  width="10" height="2"  fill="#39FF14"/>
  <rect x="0"                  y="206" width="2"  height="10" fill="#39FF14"/>
  <!-- Corner BR -->
  <rect x="370"  y="214"  width="10" height="2"  fill="#39FF14"/>
  <rect x="378"   y="206" width="2"  height="10" fill="#39FF14"/>
  <!-- Status dot -->
  <rect x="14" y="13" width="6" height="6" fill="#39FF14">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- Title -->
  <text x="28" y="20" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#39FF14" dominant-baseline="central">// LANGUAGES</text>
  <!-- Separator line -->
  <rect x="2" y="36" width="376" height="1" fill="#39FF14" opacity="0.4"/>
