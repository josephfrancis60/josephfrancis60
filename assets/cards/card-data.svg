<svg width="380" height="138" viewBox="0 0 380 138" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" shape-rendering="crispEdges" role="img" aria-label="DATA">
  <title>DATA</title>
  <!-- Shadow -->
  <rect x="4" y="4" width="376" height="134" fill="#000000" opacity="0.55"/>
  <!-- Background -->
  <rect x="0" y="0" width="380" height="138" fill="#0D0221"/>
  <!-- Color tint -->
  <rect x="0" y="0" width="380" height="138" fill="#9B5DE5" opacity="0.06"/>
  <!-- Outer border -->
  <rect x="2" y="2" width="376" height="134" fill="none" stroke="#9B5DE5" stroke-width="2"/>
  <!-- Top accent strip -->
  <rect x="2" y="2" width="376" height="34" fill="#9B5DE5" opacity="0.12"/>
  <!-- Corner TL -->
  <rect x="0"  y="0"  width="10" height="2"  fill="#9B5DE5"/>
  <rect x="0"  y="0"  width="2"  height="10" fill="#9B5DE5"/>
  <!-- Corner TR -->
  <rect x="370" y="0"            width="10" height="2"  fill="#9B5DE5"/>
  <rect x="378"  y="0"            width="2"  height="10" fill="#9B5DE5"/>
  <!-- Corner BL -->
  <rect x="0"                  y="136"  width="10" height="2"  fill="#9B5DE5"/>
  <rect x="0"                  y="128" width="2"  height="10" fill="#9B5DE5"/>
  <!-- Corner BR -->
  <rect x="370"  y="136"  width="10" height="2"  fill="#9B5DE5"/>
  <rect x="378"   y="128" width="2"  height="10" fill="#9B5DE5"/>
  <!-- Status dot -->
  <rect x="14" y="13" width="6" height="6" fill="#9B5DE5">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- Title -->
  <text x="28" y="20" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#9B5DE5" dominant-baseline="central">// DATA</text>
  <!-- Separator line -->
  <rect x="2" y="36" width="376" height="1" fill="#9B5DE5" opacity="0.4"/>
  <!-- Badges -->
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/postgresql.svg" x="62" y="52" width="140" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/mssql.svg" x="208" y="52" width="110" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/mysql.svg" x="33" y="91" width="103" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/sqlite.svg" x="142" y="91" width="110" height="33"/>
  <image href="https://raw.githubusercontent.com/josephfrancis60/josephfrancis60/main/assets/badges/jwt.svg" x="258" y="91" width="88" height="33"/>
</svg>