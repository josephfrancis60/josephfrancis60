<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="pixel grid">
  <title>pixel-grid</title>
  <defs>
    <pattern id="pixelgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="1" fill="#00F0FF" opacity="0.06"/>
      <rect x="10" y="10" width="1" height="1" fill="#00F0FF" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#pixelgrid)"/>
</svg>
