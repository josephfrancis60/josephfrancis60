name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # Daily at midnight UTC
  workflow_dispatch:

jobs:
  metrics:
    name: Generate metrics
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ──────────────────────────────────────────────────────────────────
      # 1.  Activity  (calendar + recent activity chart)
      # ──────────────────────────────────────────────────────────────────
      - name: Activity metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics/metrics-activity.svg
          base: activity, community
          plugin_activity: yes
          plugin_activity_limit: 10
          plugin_activity_days: 14
          plugin_activity_filter: all
          config_timezone: Asia/Kolkata
          config_order: activity
          committer_gist: ""

      # ──────────────────────────────────────────────────────────────────
      # 2.  Languages  (most-used + recently-used)
      # ──────────────────────────────────────────────────────────────────
      - name: Languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics/metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          config_timezone: Asia/Kolkata

      # ──────────────────────────────────────────────────────────────────
      # 3.  Achievements
      # ──────────────────────────────────────────────────────────────────
      - name: Achievements metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics/metrics-achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          config_timezone: Asia/Kolkata

      # ──────────────────────────────────────────────────────────────────
      # 4.  Issue/PR discussions  (reactions + discussions)
      # ──────────────────────────────────────────────────────────────────
      - name: Discussions metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics/metrics-discussions.svg
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_reactions_limit_issues: 100
          plugin_reactions_limit_discussions: 100
          plugin_reactions_days: 14
          plugin_reactions_display: absolute
          plugin_discussions: yes
          plugin_discussions_categories_limit: 0
          config_timezone: Asia/Kolkata
